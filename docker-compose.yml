# লোকাল ডেভেলপমেন্টের জন্য PostgreSQL ও Redis।
# অন্য প্রজেক্টের সাথে পোর্ট না মেলে তাই 5434 আর 6380 ব্যবহার করা হয়েছে।
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: allinone
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
volumes:
  pgdata:
