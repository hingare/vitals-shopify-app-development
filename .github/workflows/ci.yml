name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test (includes widget bundle size budget)
        run: pnpm test
      - run: pnpm build

  functions:
    # Shopify Functions (Rust): টেস্ট, lint, আর wasm সাইজ Shopify-র ২৫৬KB সীমার নিচে কিনা
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin/extensions/offers-discount
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --target=wasm32-wasip1 --release
      - name: Wasm size budget (256 KB)
        run: |
          size=$(stat -c %s target/wasm32-wasip1/release/offers-discount.wasm)
          echo "offers-discount.wasm: $size bytes"
          test "$size" -le 262144
