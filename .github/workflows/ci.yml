name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test (includes widget bundle size budget)
        run: pnpm test
      - run: pnpm build

  storefront:
    # দোকানের পাতায় প্রতিটা উইজেট, নকল দোকানে (packages/widgets/e2e): axe-core, কীবোর্ড আর লেআউট সরে যাওয়া
    # Playwright-এর ব্রাউজারের লাইব্রেরি জানা Ubuntu সংস্করণে বসে, তাই 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm --filter @app/widgets exec playwright install --with-deps chromium
      - run: pnpm --filter @app/widgets build
      - run: pnpm --filter @app/widgets e2e
      # আসল থিমে সব টুল একসাথের পরীক্ষাটা নিজে ঠিক চলে কিনা, দুটো নকল দোকানে (docs/storefront-tests.md)
      - run: pnpm --filter @app/widgets themes
      - name: Show the theme test report on the run page
        if: always()
        run: cat packages/widgets/test-results/themes/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the failure screenshots and page snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-test-results
          path: packages/widgets/test-results
          retention-days: 7

  speed:
    # দোকানের গতি: নকল Dawn দোকানে মোবাইল Lighthouse, অ্যাপ ছাড়া আর সব টুল চালু করে (packages/widgets/e2e/speed.ts)।
    # Built for Shopify-র নিয়মে স্কোর কতটা কমে (৫-এর বেশি হলে ব্যর্থ, লক্ষ্য ২), আর আমাদের নিজের খরচ (HTML-এ কত KB
    # যোগ, JS-এর KB আর CPU) সীমার মধ্যে কিনা। ফলাফল রানের Summary-তে আর artifact-এ (docs/storefront-tests.md)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm --filter @app/widgets exec playwright install --with-deps chromium
      - run: pnpm --filter @app/widgets build
      - run: pnpm --filter @app/widgets speed
      - name: Show the report on the run page
        if: always()
        run: cat packages/widgets/test-results/speed/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the report and every measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-speed
          path: packages/widgets/test-results/speed
          retention-days: 30

  backup-restore:
    # ব্যাকআপ নিয়ে নতুন ডাটাবেসে ফেরত আনা যায় কিনা, আর প্রতিটা টেবিল মেলে কিনা (docs/backup-restore.md)
    # ubuntu-latest (26.04)-এ PostgreSQL 16-এর client টুল নেই; সার্ভারের সংস্করণের টুল লাগে, তাই 24.04
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      RESTORED_URL: postgresql://postgres:postgres@localhost:5432/restored
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL 16 client tools
        run: test -x "$PG_BIN/pg_dump" || (sudo apt-get update && sudo apt-get install -y postgresql-client-16)
      - name: App database with 20 sample stores
        working-directory: apps/admin
        env:
          LOADTEST_SEED: "yes"
        run: |
          pnpm exec prisma migrate deploy
          node loadtest/seed.mjs --stores 20
      - name: Back up, restore into a new database, compare every table
        working-directory: apps/admin
        run: |
          node scripts/db-backup.mjs --out backups
          PGPASSWORD=postgres "$PG_BIN/createdb" -h localhost -U postgres restored
          node scripts/db-restore.mjs backups/*.dump --into "$RESTORED_URL"
          DATABASE_URL="$RESTORED_URL" pnpm exec prisma migrate status

  functions:
    # Shopify Functions (Rust): টেস্ট, lint, আর wasm সাইজ Shopify-র ২৫৬KB সীমার নিচে কিনা
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin/extensions/offers-discount
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --target=wasm32-wasip1 --release
      - name: Wasm size budget (256 KB)
        run: |
          size=$(stat -c %s target/wasm32-wasip1/release/offers-discount.wasm)
          echo "offers-discount.wasm: $size bytes"
          test "$size" -le 262144
