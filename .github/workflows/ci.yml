name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test (includes widget bundle size budget)
        run: pnpm test
      - run: pnpm build

  backup-restore:
    # ব্যাকআপ নিয়ে নতুন ডাটাবেসে ফেরত আনা যায় কিনা, আর প্রতিটা টেবিল মেলে কিনা (docs/backup-restore.md)
    # ubuntu-latest (26.04)-এ PostgreSQL 16-এর client টুল নেই; সার্ভারের সংস্করণের টুল লাগে, তাই 24.04
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      RESTORED_URL: postgresql://postgres:postgres@localhost:5432/restored
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL 16 client tools
        run: test -x "$PG_BIN/pg_dump" || (sudo apt-get update && sudo apt-get install -y postgresql-client-16)
      - name: App database with 20 sample stores
        working-directory: apps/admin
        env:
          LOADTEST_SEED: "yes"
        run: |
          pnpm exec prisma migrate deploy
          node loadtest/seed.mjs --stores 20
      - name: Back up, restore into a new database, compare every table
        working-directory: apps/admin
        run: |
          node scripts/db-backup.mjs --out backups
          PGPASSWORD=postgres "$PG_BIN/createdb" -h localhost -U postgres restored
          node scripts/db-restore.mjs backups/*.dump --into "$RESTORED_URL"
          DATABASE_URL="$RESTORED_URL" pnpm exec prisma migrate status

  functions:
    # Shopify Functions (Rust): টেস্ট, lint, আর wasm সাইজ Shopify-র ২৫৬KB সীমার নিচে কিনা
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin/extensions/offers-discount
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --target=wasm32-wasip1 --release
      - name: Wasm size budget (256 KB)
        run: |
          size=$(stat -c %s target/wasm32-wasip1/release/offers-discount.wasm)
          echo "offers-discount.wasm: $size bytes"
          test "$size" -le 262144
