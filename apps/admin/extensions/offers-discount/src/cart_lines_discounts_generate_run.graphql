query Input($customerTags: [String!]) {
  presentmentCurrencyRate
  shop {
    localTime {
      date
    }
  }
  localization {
    country {
      isoCode
    }
  }
  cart {
    abGroup: attribute(key: "_app_ab") {
      value
    }
    buyerIdentity {
      isAuthenticated
      customer {
        numberOfOrders
        hasTags(tags: $customerTags) {
          tag
          hasTag
        }
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:offers", key: "config") {
      jsonValue
    }
  }
}
