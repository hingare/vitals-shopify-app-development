# This file stores configurations for your Shopify app.
client_id = "880c58207eea1a971dd169e9d99f8932"
name = "AllInOne Dev"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# read_themes: থিমে app embed চালু আছে কিনা দেখতে
# read_orders: কোন টুল থেকে কত বিক্রি হলো (orders/paid webhook), Order Tracker-এ অর্ডারের অবস্থা,
#   আর অসমাপ্ত চেকআউট ও নতুন অর্ডারের webhook (abandoned checkout আর win-back ইমেইল)
# write_pixels, read_customer_events: স্টোরের Analytics পিক্সেল (ভিজিটর, কার্ট, চেকআউট) আর Facebook Pixels
# write_app_proxy: স্টোরফ্রন্ট থেকে /apps/app-tools-এ ইভেন্ট পাঠানোর app proxy-র জন্য Shopify-র বাধ্যতামূলক scope
# write_products: রিভিউর রেটিং প্রোডাক্টের reviews.rating metafield-এ লেখার জন্য (থিম স্টার দেখায়);
#   প্রোডাক্ট বদলের webhook আর স্টক দেখা (Back in Stock, SEO Alt Tags)
# write_discounts: অফারের automatic app discount বানানো ও তার কনফিগ metafield লেখা; Spin the Wheel-এর কুপন
# write_files: রিভিউর ছবি মার্চেন্টের Shopify Files-এ রাখার জন্য (আমাদের স্টোরেজ খরচ নেই); SEO Alt Tags-এ ছবির alt লেখা
# write_customers (পড়ার অনুমতিও এর ভেতরে): Email Marketing-এর গ্রাহক তালিকা Shopify-র সম্মতির সাথে মিলিয়ে রাখা।
#   কেউ আমাদের ফর্মে রাজি হলে বা আনসাবস্ক্রাইব করলে Shopify-র customer-এ লেখা হয়, আর Shopify-তে বদলালে
#   customers webhook দিয়ে এখানে আসে। Wishlist-এর খবর ইমেইল টুলে পাঠাতে ক্রেতার ইমেইলও এখান থেকে পড়া হয়।
#   তালিকার বাইরের কাউকে মার্কেটিং ইমেইল (যেমন abandoned checkout) পাঠানোর আগে এখান থেকেই দেখা হয়
#   তিনি Shopify-তে আনসাবস্ক্রাইব করেছেন কিনা।
#
# ক্রেতার তথ্য (protected customer data): Partner Dashboard > API access requests-এ "Protected customer data"
# আর Name, Email, Phone ফিল্ড বেছে নিতে হয়; নইলে Shopify নিচের customers, checkouts আর orders webhook দেয় না,
# বা ক্রেতার ঘরগুলো ফাঁকা পাঠায়।
# Phone লাগে শুধু Order Tracker-এ ফোন নম্বর দিয়ে খোঁজার জন্য; Address কোথাও লাগে না।
scopes = "read_themes,read_orders,write_pixels,read_customer_events,write_app_proxy,write_products,write_files,write_discounts,write_customers"

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Handled by: /app/routes/webhooks.app.subscriptions_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscriptions_update"

  # Handled by: /app/routes/webhooks.orders.paid.tsx
  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  # অর্ডার হলে সেই ক্রেতার abandoned checkout ইমেইল থামে, আর শেষ অর্ডারের সময় রাখা হয় (win-back ইমেইল)।
  # ক্রেতার তথ্যের webhook-এ শুধু দরকারি ঘরগুলো চাওয়া হয় (include_fields); ঠিকানা, ফোন বা পণ্যের তালিকা আসে না।
  # Handled by: /app/routes/webhooks.orders.create.tsx
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"
  include_fields = [ "id", "email", "checkout_token" ]

  # Abandoned checkout ইমেইল (flow চালু থাকলেই কেবল কিছু রাখা হয়)।
  # updated_at দিয়ে বোঝা যায় কোন খবরটা নতুন (ক্রেতা ইমেইল শুধরে নিলে পুরনো খবর যেন নতুনটার উপর না বসে),
  # আর এতে প্রতিটা খবর আলাদা হয়, তাই Shopify পরপর আসা খবর "একই" ভেবে বাদ দেয় না।
  # Handled by: /app/routes/webhooks.checkouts.tsx
  [[webhooks.subscriptions]]
  topics = [ "checkouts/create", "checkouts/update" ]
  uri = "/webhooks/checkouts"
  include_fields = [
    "token",
    "email",
    "abandoned_checkout_url",
    "updated_at",
    "completed_at",
    "total_price",
    "currency",
    "buyer_accepts_marketing",
    "customer.first_name",
    "shipping_address.first_name",
  ]

  # মার্কেটিং ইমেইলের সম্মতি: Shopify-তে কেউ রাজি হলে বা আনসাবস্ক্রাইব করলে আমাদের গ্রাহক তালিকাও বদলায়।
  # এই খবরে থাকে শুধু customer id, ইমেইল আর সম্মতির অবস্থা, তাই ঘর বাছার দরকার নেই।
  # Handled by: /app/routes/webhooks.customers.tsx
  [[webhooks.subscriptions]]
  topics = [ "customers_email_marketing_consent/update" ]
  uri = "/webhooks/customers"

  # নতুন customer (যেমন থিমের নিউজলেটার ফর্ম বা আমাদের Pop-up থেকে তৈরি হওয়া)। 2025-01 থেকে customer-এর
  # payload-এ সম্মতি বা ট্যাগ আসে না, তাই id দিয়ে Shopify-কে জিজ্ঞেস করা হয়; সেজন্য id আর ইমেইলই যথেষ্ট।
  # customers/update নেওয়া হয় না: সম্মতি বদলালে উপরের খবরটাই আসে।
  # Handled by: /app/routes/webhooks.customers.tsx
  [[webhooks.subscriptions]]
  topics = [ "customers/create" ]
  uri = "/webhooks/customers"
  include_fields = [ "id", "email" ]

  # Back in Stock (স্টক বদলালেও products/update আসে) আর SEO Alt Tags (নতুন ছবি)।
  # updated_at রাখা হয়েছে যাতে প্রতিটা খবর আলাদা হয়: Shopify হুবহু একই খবর পরপর এলে পরেরটা বাদ দেয়,
  # আর তখন স্টকে ফেরার খবরটাই হারিয়ে যেতে পারত।
  # Handled by: /app/routes/webhooks.products.update.tsx
  [[webhooks.subscriptions]]
  topics = [ "products/create", "products/update" ]
  uri = "/webhooks/products/update"
  include_fields = [ "id", "updated_at", "images.alt", "media.alt", "media.media_content_type" ]

  # GDPR (App Store-এর জন্য বাধ্যতামূলক). Handled by: /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

# স্টোরফ্রন্ট উইজেট থেকে অ্যানালিটিক্স ইভেন্ট আসে: https://<store>/apps/app-tools/events
# Handled by: /app/routes/proxy.events.tsx
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "app-tools"

# pnpm dev সবসময় এই ডেভেলপমেন্ট স্টোরে চলবে (আসল স্টোরে নয়)
[build]
dev_store_url = "authentic-store-bd-1nil1rrz.myshopify.com"
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
