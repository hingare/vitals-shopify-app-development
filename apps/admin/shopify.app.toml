# This file stores configurations for your Shopify app.
client_id = "880c58207eea1a971dd169e9d99f8932"
name = "AllInOne Dev"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# read_themes: থিমে app embed চালু আছে কিনা দেখতে
# read_orders: কোন টুল থেকে কত বিক্রি হলো (orders/paid webhook)
# write_pixels, read_customer_events: স্টোরের Analytics পিক্সেল (ভিজিটর, কার্ট, চেকআউট)
scopes = "read_themes,read_orders,write_pixels,read_customer_events"

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Handled by: /app/routes/webhooks.app.subscriptions_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscriptions_update"

  # Handled by: /app/routes/webhooks.orders.paid.tsx
  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  # GDPR (App Store-এর জন্য বাধ্যতামূলক). Handled by: /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

# স্টোরফ্রন্ট উইজেট থেকে অ্যানালিটিক্স ইভেন্ট আসে: https://<store>/apps/app-tools/events
# Handled by: /app/routes/proxy.events.tsx
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "app-tools"

# pnpm dev সবসময় এই ডেভেলপমেন্ট স্টোরে চলবে (আসল স্টোরে নয়)
[build]
dev_store_url = "authentic-store-bd-1nil1rrz.myshopify.com"
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
